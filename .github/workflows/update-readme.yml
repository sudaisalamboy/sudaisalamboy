name: Auto-Update README Stats

on:
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update profile views
        run: |
          # This workflow keeps the README fresh by touching it daily
          # The stats images (vercel/heroku/ghchart) auto-update on their own
          # This just ensures the repo stays active
          echo "README auto-update triggered at $(date -u)"
          echo "Stats URLs verified:"
          echo "  - github-readme-stats: https://github-readme-stats.vercel.app"
          echo "  - streak-stats: https://streak-stats.demolab.com"
          echo "  - contribution graph: https://ghchart.rshah.org"
          echo "  - profile views: https://komarev.com"

      - name: Create empty commit to keep activity graph alive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: daily README stats refresh" || echo "No changes to commit"
          git push
